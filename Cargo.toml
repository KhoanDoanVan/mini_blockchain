[package]
name = "rust_blockchain"
version = "0.1.0"
edition = "2024"

[dependencies]
# Cryptography
sha2 = "0.10"
secp256k1 = { version = "0.28", features = ["rand-std"] }
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
bincode = "1.3"

# Utils
chrono = "0.4"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"